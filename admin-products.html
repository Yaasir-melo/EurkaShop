<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products | Eureka Shop</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="admin-body">
    <div data-vue-header>
        <header class="header admin-header"><div class="container">
            <a class="logo" href="index.html"><h1><i class="fas fa-shopping-bag"></i> Eureka Shop</h1></a>
            <nav class="nav" aria-label="Admin navigation"><ul><li><a href="admin.html">Dashboard</a></li><li><a href="index.html">View Store</a></li></ul></nav>
        </div></header>
    </div>
    <main class="admin-main container">
        <section class="admin-panel admin-login-panel" id="adminLoginPanel">
            <p class="admin-eyebrow">RESTRICTED ACCESS</p><h2>Admin sign in</h2><p>Sign in with an account authorized by the store owner.</p>
            <form id="adminLoginForm" class="admin-form" method="post" onsubmit="return false;"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="admin-submit">Sign in securely</button><p id="adminAuthMessage" class="admin-message" role="status"></p></form>
        </section>
        <section id="adminProductsApp" hidden>
            <div class="admin-heading"><div><p class="admin-eyebrow">CATALOG</p><h2>Manage products</h2><p id="adminSignedInAs"></p></div><div class="admin-products-heading-actions"><a class="admin-submit admin-link-button" href="admin-product.html"><i class="fas fa-plus"></i> Add product</a><button id="adminSignOut" class="admin-signout" type="button">Sign out</button></div></div>
            <section class="admin-panel">
                <div class="admin-products-toolbar"><label class="admin-search">Search products<input id="adminProductSearch" type="search" placeholder="Search by name or description"></label><label class="admin-category-filter">Category<select id="adminCategoryFilter"><option value="all">All categories</option></select></label><span class="admin-count-inline"><strong id="adminProductCount">0</strong> products</span></div>
                <p id="adminListMessage" class="admin-message" role="status" aria-live="polite"></p>
                <div class="admin-table-wrap"><table class="admin-product-table"><thead><tr><th>Photo</th><th>Product</th><th>Category</th><th>Price</th><th>Variations</th><th>Actions</th></tr></thead><tbody id="adminProductRows"></tbody></table></div>
                <p id="adminEmpty" class="admin-empty" hidden>No products match these filters.</p>
            </section>
        </section>
    </main>
    <script src="js/admin-file-guard.js"></script>
    <script type="module" src="js/vue-shell.js"></script>
    <script src="js/products-data.js"></script>
    <script type="module" src="js/admin-products.js"></script>
</body>
</html>
